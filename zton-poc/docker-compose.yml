# ZTON 4-Device Demo — Zero Trust Overlay over Raw UDP
#
# Laptop A (Hub)     → http://localhost:8080
# Laptop B (Sender)  → http://localhost:8081
# Phone B  (Viewer)  → http://localhost:8082
# Phone A  (Blocked) → http://localhost:8083
#
# For 4 physical devices on a LAN, set ZTON_HUB_HOST to Laptop A's IP
# on each node and expose ports 8080 + 9999/udp on the hub machine.

services:
  ziti-controller:
    image: openziti/quickstart:latest
    container_name: ziti-controller
    hostname: ziti-edge-controller
    profiles:
      - openziti
    environment:
      ZITI_BOOTSTRAP: "true"
      ZITI_BOOTSTRAP_USER: admin
      ZITI_BOOTSTRAP_PASSWORD: adminpassword
      ZITI_USER: admin
      ZITI_PWD: adminpassword
      ZITI_CTRL_ADVERTISED_ADDRESS: ziti
      ZITI_CTRL_ADVERTISED_PORT: "6262"
      ZITI_CTRL_EDGE_ADVERTISED_ADDRESS: ziti-edge-controller
      ZITI_CTRL_EDGE_ADVERTISED_PORT: "1280"
    ports:
      - "1280:1280"
      - "8443:8443"
    volumes:
      - ziti-data:/persistent
    networks:
      zton-net:
        aliases:
          - ziti
          - ziti-edge-controller
    command: /var/openziti/scripts/run-controller.sh

  ziti-router:
    image: openziti/quickstart:latest
    container_name: ziti-router
    hostname: ziti-edge-router
    profiles:
      - openziti
    depends_on:
      - ziti-controller
    environment:
      ZITI_CTRL_EDGE_ADVERTISED_ADDRESS: ziti-edge-controller
      ZITI_CTRL_EDGE_ADVERTISED_PORT: "1280"
      ZITI_CTRL_ADVERTISED_ADDRESS: ziti
      ZITI_CTRL_ADVERTISED_PORT: "6262"
      ZITI_USER: admin
      ZITI_PWD: adminpassword
      ZITI_ROUTER_NAME: ziti-edge-router
      ZITI_ROUTER_ROLES: public
      ZITI_ROUTER_PORT: "3022"
    ports:
      - "3022:3022"
    volumes:
      - ziti-data:/persistent
    networks:
      - zton-net
    command: /var/openziti/scripts/run-router.sh edge

  ziti-bootstrap:
    image: openziti/quickstart:latest
    container_name: ziti-bootstrap
    profiles:
      - openziti
    depends_on:
      - ziti-controller
      - ziti-router
    environment:
      ZITI_CTRL_EDGE_ADVERTISED_ADDRESS: ziti-edge-controller
      ZITI_CTRL_EDGE_ADVERTISED_PORT: "1280"
      ZITI_USER: admin
      ZITI_PWD: adminpassword
    volumes:
      - ziti-data:/persistent
      - ./openziti-bootstrap.sh:/openziti-bootstrap.sh:ro
    networks:
      - zton-net
    command: /bin/bash /openziti-bootstrap.sh

  ziti-tunnel-hub:
    image: openziti/ziti-edge-tunnel:latest
    container_name: ziti-tunnel-hub
    profiles:
      - openziti
    depends_on:
      ziti-bootstrap:
        condition: service_completed_successfully
      laptop-a:
        condition: service_started
    network_mode: "service:laptop-a"
    volumes:
      - ziti-data:/persistent:ro
      - ziti-hub-identity:/identities
    entrypoint: /bin/sh
    command: >
      -c "set -e;
      if [ ! -s /identities/zton-hub-host.json ]; then
        ziti-edge-tunnel enroll -j /persistent/zton-identities/zton-hub-host.jwt -i /identities/zton-hub-host.json;
      fi;
      exec ziti-edge-tunnel run-host -i /identities/zton-hub-host.json -v 3"

  ziti-tunnel-laptop-b:
    image: openziti/ziti-edge-tunnel:latest
    container_name: ziti-tunnel-laptop-b
    profiles:
      - openziti
    depends_on:
      ziti-bootstrap:
        condition: service_completed_successfully
      laptop-b:
        condition: service_started
    network_mode: "service:laptop-b"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ziti-data:/persistent:ro
      - ziti-laptop-b-identity:/identities
    entrypoint: /bin/sh
    command: >
      -c "set -e;
      if [ ! -s /identities/zton-laptop-b-client.json ]; then
        ziti-edge-tunnel enroll -j /persistent/zton-identities/zton-laptop-b-client.jwt -i /identities/zton-laptop-b-client.json;
      fi;
      exec ziti-edge-tunnel run -i /identities/zton-laptop-b-client.json -v 3"

  ziti-tunnel-phone-b:
    image: openziti/ziti-edge-tunnel:latest
    container_name: ziti-tunnel-phone-b
    profiles:
      - openziti
    depends_on:
      ziti-bootstrap:
        condition: service_completed_successfully
      phone-b:
        condition: service_started
    network_mode: "service:phone-b"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ziti-data:/persistent:ro
      - ziti-phone-b-identity:/identities
    entrypoint: /bin/sh
    command: >
      -c "set -e;
      if [ ! -s /identities/zton-phone-b-client.json ]; then
        ziti-edge-tunnel enroll -j /persistent/zton-identities/zton-phone-b-client.jwt -i /identities/zton-phone-b-client.json;
      fi;
      exec ziti-edge-tunnel run -i /identities/zton-phone-b-client.json -v 3"

  ziti-tunnel-phone-a:
    image: openziti/ziti-edge-tunnel:latest
    container_name: ziti-tunnel-phone-a
    profiles:
      - openziti
    depends_on:
      ziti-bootstrap:
        condition: service_completed_successfully
      phone-a:
        condition: service_started
    network_mode: "service:phone-a"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ziti-data:/persistent:ro
      - ziti-phone-a-identity:/identities
    entrypoint: /bin/sh
    command: >
      -c "set -e;
      if [ ! -s /identities/zton-phone-a-client.json ]; then
        ziti-edge-tunnel enroll -j /persistent/zton-identities/zton-phone-a-client.jwt -i /identities/zton-phone-a-client.json;
      fi;
      exec ziti-edge-tunnel run -i /identities/zton-phone-a-client.json -v 3"

  laptop-a:
    build: .
    container_name: zton-laptop-a
    hostname: laptop-a
    environment:
      ZTON_ROLE: hub
      ZTON_DEVICE_ID: laptop-a
      ZTON_DEVICE_NAME: "Laptop A (Hub)"
      ZTON_UDP_PORT: "9999"
      ZTON_WEB_PORT: "8080"
      ZTON_KEYS_DIR: /app/keys
      ZITI_CTRL_HOST: ziti-edge-controller
      ZITI_CTRL_PORT: "1280"
      ZITI_ROUTER_HOST: ziti-edge-router
      ZITI_ROUTER_PORT: "3022"
      ZITI_CONSOLE_URL: "https://localhost:1280/zac/"
    ports:
      - "8080:8080"
      - "9999:9999/udp"
    networks:
      - zton-net
    volumes:
      - zton-keys:/app/keys
    working_dir: /app

  laptop-b:
    build: .
    container_name: zton-laptop-b
    hostname: laptop-b
    depends_on:
      - laptop-a
    environment:
      ZTON_ROLE: node
      ZTON_DEVICE_ID: laptop-b
      ZTON_DEVICE_NAME: "Laptop B (Authorized Sender)"
      ZTON_HUB_HOST: zton-hub.openziti
      ZTON_UDP_PORT: "9999"
      ZTON_WEB_PORT: "8080"
      ZTON_AUTHORIZED: "true"
      ZTON_TARGETS: "phone-b,hub"
      ZTON_KEYS_DIR: /app/keys
    ports:
      - "8081:8080"
    networks:
      - zton-net
    volumes:
      - zton-keys:/app/keys

  phone-b:
    build: .
    container_name: zton-phone-b
    hostname: phone-b
    depends_on:
      - laptop-a
    environment:
      ZTON_ROLE: node
      ZTON_DEVICE_ID: phone-b
      ZTON_DEVICE_NAME: "Phone B (Authorized Viewer)"
      ZTON_HUB_HOST: zton-hub.openziti
      ZTON_UDP_PORT: "9999"
      ZTON_WEB_PORT: "8080"
      ZTON_AUTHORIZED: "true"
      ZTON_TARGETS: "hub"
      ZTON_KEYS_DIR: /app/keys
    ports:
      - "8082:8080"
    networks:
      - zton-net
    volumes:
      - zton-keys:/app/keys

  phone-a:
    build: .
    container_name: zton-phone-a
    hostname: phone-a
    depends_on:
      - laptop-a
    environment:
      ZTON_ROLE: node
      ZTON_DEVICE_ID: phone-a
      ZTON_DEVICE_NAME: "Phone A (Unauthorized)"
      ZTON_HUB_HOST: zton-hub.openziti
      ZTON_UDP_PORT: "9999"
      ZTON_WEB_PORT: "8080"
      ZTON_AUTHORIZED: "false"
      ZTON_TARGETS: ""
      ZTON_KEYS_DIR: /app/keys
    ports:
      - "8083:8080"
    networks:
      - zton-net
    volumes:
      - zton-keys:/app/keys

networks:
  zton-net:
    driver: bridge

volumes:
  zton-keys:
  ziti-data:
  ziti-hub-identity:
  ziti-laptop-b-identity:
  ziti-phone-b-identity:
  ziti-phone-a-identity:
